<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swing on a Jeet · $KATTBATT</title>
<meta name="theme-color" content="#07051a">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07051a;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#eef2ff}
  #stage{position:relative}
  canvas{display:block;border-radius:14px;box-shadow:0 0 60px rgba(120,70,220,.35)}
  .hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
  .chip{pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:40px;display:inline-flex;align-items:center;background:rgba(5,9,18,.85);border:1px solid #6a4bd0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;font-family:Inter,system-ui,sans-serif;color:#eef2ff;text-decoration:none;cursor:pointer}
  .chip:hover{border-color:#ffc83d}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <a class="chip" id="homeBtn" href="/">← Home</a>
    <button class="chip" id="mute" type="button">🔊</button>
  </div>
</div>
<script>
(() => {
const W = 420, H = 720, GROUND = 650;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1;
function fit(){
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W*scale + "px"; cv.style.height = H*scale + "px";
  cv.width = W*scale*dpr; cv.height = H*scale*dpr;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener("resize", fit); fit();
const RR = (x,y,w,h,r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); };

/* ---------- storage ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- sound ---------- */
let actx = null, muted = store.get("kb_muted", false);
const muteBtn = document.getElementById("mute");
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.onclick = e => { e.stopPropagation(); muted = !muted; store.set("kb_muted", muted); muteBtn.textContent = muted ? "🔇" : "🔊"; };
function tone(freq, dur, type="square", vol=.08, slide=0, delay=0){
  if (muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function noise(dur, vol=.25){
  if (muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const b = actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 3);
    const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = vol;
    s.buffer = b; s.connect(g).connect(actx.destination); s.start();
  }catch(e){}
}
function say(t){
  if (muted || !window.speechSynthesis) return;
  try{
    const u = new SpeechSynthesisUtterance(t);
    u.rate = 1.15; u.pitch = .55; u.volume = 1;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /^en/i.test(v.lang) && /(male|david|fred|daniel|alex|guy|aaron|arthur)/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
const sfx = {
  swing: () => tone(260,.12,"triangle",.05,-160),
  bonk:  () => { noise(.12,.35); tone(700,.1,"square",.06,-450); },
  moon:  () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,"square",.05,0,i*.07)),
  ouch:  () => tone(180,.35,"sawtooth",.09,-100),
  bad:   () => [300,220].forEach((f,i)=>tone(f,.2,"square",.06,0,i*.15)),
  over:  () => [392,330,262,196].forEach((f,i)=>tone(f,.25,"triangle",.08,0,i*.18)),
  coin:  () => { tone(1200,.05,"square",.04); tone(1800,.08,"square",.04,0,.05); },
  power: () => [440,660,880,1320].forEach((f,i)=>tone(f,.12,"square",.05,0,i*.06)),
  shield:() => [880,660].forEach((f,i)=>tone(f,.15,"triangle",.07,0,i*.1))
};

2AAA");
const CITY_Y = 306.7, CITY_W = 1280.0, CITY_H = 413.3;

/* ---------- constants ---------- */
const KNOB = {x: 92, y: GROUND - 22};         // KattBatt's handle position (pivot)
const HIT_MIN = 138, HIT_MAX = 262, SWEET = 200;
const zone = () => power && power.big > 0 ? {min:128, max:318, sweet:220} : {min:HIT_MIN, max:HIT_MAX, sweet:SWEET};
const PU = {
  big:    {icon:"💪", label:"BIG BATT",       color:"#ffc83d", dur:540},
  x2:     {icon:"2X", label:"DOUBLE POINTS",  color:"#7bff9e", dur:600},
  shield: {icon:"💎", label:"DIAMOND SHIELD", color:"#6ad1ff", dur:0}
};
const SWING_LEN = 16, CONTACT_F = 6, RECOVER = 10;
const REST_A = -0.38, SWING_A = 0.72;
const JEET_SIGNS = ["SOLD","JEET","DUMP","-90%","PAPER","EXIT"];
const HOODIES = ["#d6455a","#e0703a","#b8475e","#c43c3c","#e25c8a"];

/* ---------- state ---------- */
let state = "title", frame = 0, best = store.get("kb_jeet_best", 0);
let score, combo, bestCombo, lives, kos, walkers, parts, pops, swing, shake, flash, spawnT, cityX, level, overT, newBest;
let power, pickups, puT, bubble, lastSay, sizeK;

function reset(){
  score = 0; combo = 0; bestCombo = 0; lives = 3; kos = 0; level = 0;
  walkers = []; parts = []; pops = []; shake = 0; flash = 0; spawnT = 30; cityX = 0; overT = 0; newBest = false;
  swing = {t:-1, hitDone:false, cool:0};
  power = {big:0, x2:0, shield:0}; pickups = []; puT = 420; bubble = null; lastSay = 0; sizeK = 1;
}
reset();

function spawn(){
  const r = Math.random();
  const lv = level;
  let type = "jeet";
  if (lv >= 1 && r < .16) type = "whale";
  else if (r > .80 - Math.min(.12, lv*.02)) type = Math.random() < .35 ? "boo" : "holder";
  else if (lv >= 2 && r < .30) type = "runner";
  const base = 2.7 + lv*.24;
  const w = {
    type, x: W + 30, y: GROUND, t: Math.random()*10, state: "walk",
    speed: type==="runner" ? base*1.8 : type==="whale" ? base*.75 : type==="boo" ? base*.9 : base*(0.9+Math.random()*.3),
    hp: type==="whale" ? 2 : 1, vx:0, vy:0, rot:0, spin:0, knock:0,
    color: type==="holder" ? ["#2fbf71","#27a863","#35c985"][Math.floor(Math.random()*3)] : HOODIES[Math.floor(Math.random()*HOODIES.length)],
    sign: type==="holder" ? "HODL" : type==="whale" ? "DUMP" : JEET_SIGNS[Math.floor(Math.random()*JEET_SIGNS.length)],
    scale: type==="whale" ? 1.35 : type==="runner" ? .92 : 1
  };
  walkers.push(w);
}

/* ---------- input ---------- */
const shareBtn = {x:W/2-95, y:0, w:190, h:44};
function press(e){
  if (e && e.target && e.target.closest && e.target.closest(".chip")) return;
  if (e && e.preventDefault) e.preventDefault();
  if (state === "title"){ state = "play"; reset(); return; }
  if (state === "over"){
    if (e && e.clientX !== undefined){
      const r = cv.getBoundingClientRect(), x=(e.clientX-r.left)/scale, y=(e.clientY-r.top)/scale;
      if (x>shareBtn.x && x<shareBtn.x+shareBtn.w && y>shareBtn.y && y<shareBtn.y+shareBtn.h){
        const t = `I knocked out ${kos} jeets (${score} pts, ${bestCombo}x combo) in Swing on a Jeet 🦇⚾ $KATTBATT`;
        window.open("https://x.com/intent/post?text="+encodeURIComponent(t)+"&url="+encodeURIComponent(location.href),"_blank","noopener");
        return;
      }
    }
    if (overT > 45){ state = "play"; reset(); }
    return;
  }
  if (state === "play" && swing.t < 0 && swing.cool <= 0){
    swing = {t:0, hitDone:false, cool:0}; sfx.swing();
  }
}
cv.addEventListener("pointerdown", press);
window.addEventListener("keydown", e => {
  if (["Space","Enter","KeyS","ArrowRight"].includes(e.code)){ e.preventDefault(); press(null); }
  if (e.key === "Escape") location.href = "/";
});

/* ---------- swing ---------- */
function batAngle(){
  const idle = REST_A + Math.sin(frame*.12)*.04;
  if (swing.t < 0) return idle;
  const k = Math.min(1, swing.t / SWING_LEN);
  // fast forward (0..0.45), then return
  if (k < .45){ const e = k/.45; return REST_A + (SWING_A-REST_A) * (1 - Math.pow(1-e,3)); }
  const e = (k-.45)/.55; return SWING_A + (REST_A-SWING_A) * (e*e);
}
function doContact(){
  const Z = zone(), big = power.big > 0;
  // power-ups can be swung at to grab them early
  for (const p of pickups) if (!p.got && p.x > Z.min - 20 && p.x < Z.max + 20) grab(p);
  let targets = walkers.filter(w => w.state === "walk" && w.x > Z.min && w.x < Z.max);
  if (!targets.length){ combo = 0; swing.cool = RECOVER; return; }   // whiff
  targets.sort((a,b) => Math.abs(a.x-Z.sweet) - Math.abs(b.x-Z.sweet));
  if (!big) targets = [targets[0]];                                    // normal: one at a time
  let koThisSwing = 0;
  for (const target of targets){
    const d = Math.abs(target.x - Z.sweet);
    const q = 1 - Math.min(1, d / ((Z.max-Z.min)/2));
    if (target.type === "holder" || target.type === "boo"){
      if (big && targets.length > 1) continue;                          // big sweep skips holders
      lives--; combo = 0; shake = 10; flash = .5; sfx.bad();
      target.state = "ko"; target.vx = 5; target.vy = -7; target.spin = .15;
      pops.push({t: target.type==="boo" ? "NOT BOO BOO!" : "THAT'S A HOLDER!", x:W/2, y:230, c:"#ff4d5a", life:80, big:true});
      pops.push({t:"-1 💰", x:target.x, y:target.y-110, c:"#ff4d5a", life:60});
      if (lives <= 0) gameOver();
      return;
    }
    shake = Math.max(shake, (big ? 12 : 6) + q*10);
    for (let i=0;i<(big?24:14);i++) parts.push({x:target.x-10, y:target.y-80*target.scale, vx:Math.random()*7-1, vy:(Math.random()-.5)*8, life:26, c:i%2?"#fff":"#ffc83d", s:big?4:3});
    if (target.hp > 1 && !big){
      target.hp--; target.knock = 18; target.x += 40;
      pops.push({t:"WHALE! HIT AGAIN", x:target.x, y:target.y-150, c:"#6ad1ff", life:50});
      continue;
    }
    combo++; bestCombo = Math.max(bestCombo, combo); kos++; koThisSwing++;
    const mult = Math.min(8, 1 + Math.floor(combo/3)) * (power.x2 > 0 ? 2 : 1);
    const perfect = q > .82;
    let pts = (target.type==="whale" ? 300 : target.type==="runner" ? 150 : 100) * mult;
    if (perfect) pts *= 2;
    score += pts;
    target.state = "ko";
    const boost = big ? 1.5 : 1;
    target.vx = (7 + q*8)*boost; target.vy = -(9 + q*9)*boost; target.spin = .25 + q*.3;
    if (perfect){ target.moon = true; target.vx = 9; target.vy = -17; sfx.moon(); flash = .35; }
    const word = perfect ? "TO THE MOON!" : ["BONK!","WHAM!","KNOCKED OUT!","BATTED!","SWUNG ON!"][Math.floor(Math.random()*5)];
    pops.push({t: word, x: Math.min(W-90, target.x+20), y: target.y-150*target.scale, c: perfect ? "#ffc83d" : "#fff", life:55, big:true});
    pops.push({t:`+${pts}${mult>1?`  ${mult}x`:""}`, x: Math.min(W-70, target.x+20), y: target.y-115*target.scale, c:"#7bff9e", life:50});
    if (Math.random() < .35) parts.push({coin:true, x:target.x, y:target.y-60, vx:-2-Math.random()*2, vy:-6, life:90, c:"#ffc83d", s:9});
  }
  if (koThisSwing){
    sfx.bonk();
    bubble = {t: koThisSwing > 1 ? "YEAH BITCH!!" : "YEAH BITCH!", life: 48};
    const now = performance.now();
    if (now - lastSay > 1600){ lastSay = now; say("Yeah bitch!"); }
  }
}
function grab(p){
  if (p.got) return;
  p.got = true; sfx.power(); flash = .25;
  const def = PU[p.kind];
  if (p.kind === "shield") power.shield = Math.min(2, power.shield + 1);
  else power[p.kind] = def.dur;
  pops.push({t: def.label + "!", x: W/2, y: 200, c: def.color, life: 70, big:true});
  for (let i=0;i<20;i++){ const a=i/20*6.283; parts.push({x:p.x, y:p.y, vx:Math.cos(a)*4, vy:Math.sin(a)*4, life:30, c:def.color, s:3}); }
  if (p.kind === "big"){ bubble = {t:"I'M THAT BATT!", life:60}; }
}
function gameOver(){
  state = "over"; overT = 0; sfx.over();
  if (score > best){ best = score; store.set("kb_jeet_best", best); newBest = true; }
}

/* ---------- update ---------- */
function update(){
  frame++;
  if (state !== "over") cityX += state === "play" ? 1.9 + level*.12 : .6;
  if (state === "play"){
    level = Math.min(8, Math.floor(score / 1500));
    if (--spawnT <= 0){
      spawn();
      const gapBase = Math.max(32, 62 - level*5);
      spawnT = gapBase + Math.random()*gapBase*.8;
    }
    if (swing.t >= 0){
      swing.t++;
      if (swing.t === CONTACT_F && !swing.hitDone){ swing.hitDone = true; doContact(); }
      if (swing.t > SWING_LEN){ swing.t = -1; }
    }
    if (swing.cool > 0) swing.cool--;
    if (power.big > 0) power.big--;
    if (power.x2 > 0) power.x2--;
    sizeK += ((power.big > 0 ? 1.45 : 1) - sizeK) * .12;
    if (--puT <= 0){
      const kinds = ["big","x2","shield"];
      pickups.push({kind: kinds[Math.floor(Math.random()*kinds.length)], x: W + 30, y: GROUND - 96, t: 0, got:false});
      puT = 600 + Math.random()*420;                 // one every ~10-17 seconds
    }
    for (const p of pickups){
      p.t += .08; p.x -= 2.2 + level*.15;
      if (!p.got && p.x < KNOB.x + 40) grab(p);
    }
    pickups = pickups.filter(p => !p.got && p.x > -40);
    if (bubble && --bubble.life <= 0) bubble = null;
    for (const w of walkers){
      w.t += .2;
      if (w.state === "walk"){
        if (w.knock > 0){ w.knock--; w.x += 1.5; continue; }
        w.x -= w.speed;
        if (w.x < KNOB.x + 18){
          if (w.type === "holder" || w.type === "boo"){ w.state = "pass"; }
          else {
            // a jeet got through
            w.state = "gone";
            if (power.shield > 0){
              power.shield--; sfx.shield(); flash = .3;
              pops.push({t:"DIAMOND SHIELD BLOCKED IT!", x:W/2, y:230, c:"#6ad1ff", life:70, big:true});
            } else {
              lives--; combo = 0; shake = 8; sfx.ouch();
              pops.push({t:"JEET GOT AWAY! -1 💰", x:W/2, y:230, c:"#ff4d5a", life:70, big:true});
              if (lives <= 0) gameOver();
            }
          }
        }
      } else if (w.state === "pass"){
        w.x -= w.speed;
      } else if (w.state === "ko"){
        w.x += w.vx; w.y += w.vy; w.vy += w.moon ? .25 : .55; w.rot += w.spin;
        if (w.moon && frame % 2 === 0) parts.push({x:w.x, y:w.y-40, vx:0, vy:0, life:20, c:"#ffc83d", s:4});
      }
    }
    walkers = walkers.filter(w => w.x > -80 && w.x < W + 200 && w.y < H + 200 && w.y > -300 && w.state !== "gone");
  }
  if (state === "over") overT++;
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += p.coin ? .35 : .15; p.life--;
    if (p.coin){
      if (p.y > GROUND - 8){ p.y = GROUND - 8; p.vy *= -.4; p.vx *= .8; }
      if (Math.abs(p.x - KNOB.x) < 40 && state === "play"){ p.life = 0; score += 25; sfx.coin(); pops.push({t:"+25", x:p.x, y:p.y-20, c:"#ffc83d", life:35}); }
      p.x -= 1.3;
    }
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops){ p.y -= .6; p.life--; }
  pops = pops.filter(p => p.life > 0);
  shake *= .85; flash *= .88;
}

  for (const p of parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life/25));
    if (p.coin){ ctx.fillStyle="#e0a400"; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); ctx.fillStyle="#ffc83d"; ctx.beginPath(); ctx.arc(p.x,p.y,p.s-2,0,7); ctx.fill(); }
    else { ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s); }
  }
  ctx.globalAlpha = 1;
  for (const p of pops){ ctx.globalAlpha = Math.min(1, p.life/18); text(p.t, p.x, p.y, p.big ? (p.t.length>14?20:26) : 16, p.c); }
  ctx.globalAlpha = 1;
  if (state !== "title") drawHUD();
  if (state === "title") drawTitle();
  if (state === "over") drawOver();
  if (flash > .02){ ctx.fillStyle = `rgba(255,240,200,${flash*.5})`; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

window.__game = () => ({state, walkers, score, kos, lives, swing, power, pickups});
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now-last); last = now;
  while (acc >= 1000/60){ update(); acc -= 1000/60; }
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

/* Home button: go to the main page no matter how it's tapped */
(() => {
  const home = document.getElementById("homeBtn");
  const go = e => { e.preventDefault(); e.stopPropagation(); location.href = "/"; };
  home.addEventListener("pointerup", go);
  home.addEventListener("touchend", go, {passive:false});
  home.addEventListener("click", go);
})();
</script>
</body>
