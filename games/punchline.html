<script>
/* ==========================================================================
   KATTBATT PUNCH — shared rules
   --------------------------------------------------------------------------
   This one file is used by BOTH the browser game and the server.
   The game is a pure function of (seed, list of taps). The browser plays it
   live; the server re-plays the exact same taps from the exact same seed and
   computes the score itself. A score can't be faked by editing the page,
   because the server never trusts the number the browser reports.

   RULES FOR EDITING THIS FILE (it must stay deterministic):
   - No Math.random, Date, Math.sin/cos/pow (engines can differ in the last bit).
     Only + - * / Math.floor Math.min Math.max and the seeded rnd() below.
   - Anything cosmetic (jokes, particle colours, burst words) belongs in the game
     page, NOT here, so it can never change a score.
   - After any change run:  node tools/build.mjs && node tests/run.mjs
   ========================================================================== */
var KBRULES = (function () {
  "use strict";

  var W = 420, H = 720;
  var START_FRAMES = 2700;        // 45 s set at 60 fps
  var MAX_FRAMES_LEFT = 4500;     // time can never be banked above 75 s
  var MAX_RUN_FRAMES = 14400;     // hard stop (4 min) — safety net only
  var TAP_SLOP_X = 9, TAP_SLOP_Y = 8;   // extra reach (px) around a person when no exact hit is found
  var COOLDOWN = 5;               // frames between punches (~12 punches / s max)
  var RISE = 6, SINK = 6;         // pop-up / drop-down animation frames
  var HIT_ANIM = 16;              // how long a punched person lingers on screen
  var DRINK_BONUS = 240;          // waitress: +4 s
  var PIMP_BONUS = 300;           // Batt's Pimp: +5 s ...
  var PIMP_MODE = 300;            // ... and 5 s of double points
  var WILD_LEN = 300;             // full crowd meter: 5 s of double points
  var HOLDER_PENALTY = 250;       // punching the community: -250 points, combo lost, crowd meter drops
  var MAX_TAPS = 3000;

  /* ----- the club: 8 tables in rows of 3-2-3, 16 seats ---------------------
     Heads pop up from behind the tables. ROWS go back-to-front; rows get
     bigger toward the front. Rows alternate 3 / 2 tables so nobody hides
     anybody else, and the people are big enough to read their signs.        */
  var ROWS = [
    { s: 0.86, ty: 380, xs: [66, 210, 354] },
    { s: 1.00, ty: 516, xs: [138, 282] },
    { s: 1.14, ty: 660, xs: [66, 210, 354] }
  ];
  var LANES = [452, 592];         // waitress walks along these (feet y): between rows 1-2 and rows 2-3
  var TABLES = [], SLOTS = [];
  ROWS.forEach(function (r, ri) {
    r.xs.forEach(function (tx) {
      var ti = TABLES.length;
      TABLES.push({ x: tx, y: r.ty, s: r.s, row: ri });
      [-1, 1].forEach(function (d) {
        SLOTS.push({ x: tx + d * 27 * r.s, y: r.ty - 12 * r.s, s: r.s, table: ti, row: ri });
      });
    });
  });

  /* ----- who's in the crowd ------------------------------------------------ */
  var KINDS = {
    jeet:   { bad: 1, pts: 100, stay: 1.00, weight: 26, name: "JEET" },
    paper:  { bad: 1, pts: 100, stay: 1.00, weight: 22, name: "PAPER HANDS" },
    kol:    { bad: 1, pts: 150, stay: 0.95, weight: 18, name: "FAKE KOL" },
    tg:     { bad: 1, pts: 150, stay: 0.95, weight: 16, name: "TG DMER" },
    dev:    { bad: 1, pts: 200, stay: 0.80, weight: 12, name: "RUGGING DEV" },
    vc:     { bad: 1, pts: 300, stay: 0.70, weight: 6,  name: "VC W/ MEGAPHONE" },
    holder: { bad: 0, pts: 0,   stay: 1.00, weight: 0,  name: "COMMUNITY" },
    pimp:   { bad: 0, pts: 0,   stay: 0.80, weight: 0,  name: "BATT'S PIMP" },
    waitress: { bad: 0, pts: 0, stay: 1,    weight: 0,  name: "WAITRESS" }
  };
  var BAD_KINDS = ["jeet", "paper", "kol", "tg", "dev", "vc"];
  var BAD_TOTAL = 0;
  BAD_KINDS.forEach(function (k) { BAD_TOTAL += KINDS[k].weight; });

  function mulberry32(a) {
    a = a | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function lerp(a, b, d) { return a + (b - a) * d; }

  /* hit box of an entity at its current position */
  function entRect(e) {
    if (e.slot >= 0) {
      var sl = SLOTS[e.slot], s = sl.s;
      return { x1: sl.x - 27 * s, x2: sl.x + 27 * s, y1: sl.y - 84 * s, y2: sl.y - 4 * s };
    }
    return { x1: e.x - 32, x2: e.x + 32, y1: e.y - 86, y2: e.y - 4 };
  }

  function createSim(seed) {
    seed = seed >>> 0;
    var rnd = mulberry32(seed);
    function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }

    var s = {
      seed: seed, frame: 0, timeLeft: START_FRAMES,
      score: 0, combo: 0, maxCombo: 0, punches: 0, hits: 0, misses: 0, drinks: 0, pimps: 0, holders: 0,
      meter: 0, wild: 0, pimp: 0, cooldown: 0,
      over: false, reason: "",
      ents: [], events: [], reactions: [],
      occ: [], nextId: 1,
      spawnT: 40, waitT: ri(600, 1000), pimpT: ri(660, 1100)
    };
    for (var i = 0; i < SLOTS.length; i++) s.occ.push(null);

    function diff() { var d = s.frame / 2400; return d > 1 ? 1 : d; }

    function freeSlot() {
      var list = [];
      for (var i = 0; i < s.occ.length; i++) if (!s.occ[i]) list.push(i);
      if (!list.length) return -1;
      return list[Math.floor(rnd() * list.length)];
    }
    function pickBad() {
      var u = rnd() * BAD_TOTAL, acc = 0;
      for (var i = 0; i < BAD_KINDS.length; i++) {
        acc += KINDS[BAD_KINDS[i]].weight;
        if (u < acc) return BAD_KINDS[i];
      }
      return BAD_KINDS[0];
    }
    function addPerson(kind, slot, stay) {
      var f = s.frame;
      var e = {
        id: s.nextId++, kind: kind, slot: slot, lane: -1,
        born: f, hitStart: f + RISE, hitEnd: f + RISE + stay, removeAt: f + RISE + stay + SINK,

/* ==========================================================================
   KATTBATT PUNCH LINE: talking to the backend. Plain fetch, no libraries.
   ========================================================================== */
const Net = (function () {
  "use strict";
  const CFG = window.KB_CONFIG || {};
  const API_BASE = (CFG.API_BASE || "").replace(/\/+$/, "");

  class NetError extends Error {
    constructor(code, status, data) { super(code); this.code = code; this.status = status; this.data = data || {}; }
  }
  async function request(method, path, body) {
    const headers = {};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    let res;
    try {
      res = await fetch(API_BASE + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    } catch (e) { throw new NetError("offline", 0); }
    let json = null; try { json = await res.json(); } catch (e) { /* not json */ }
    if (!res.ok) throw new NetError((json && json.error) || "http_" + res.status, res.status, json);
    return json || {};
  }
  const get = p => request("GET", p);
  const post = (p, b) => request("POST", p, b);

  const MESSAGES = {
    offline: "Can't reach the game server. Check your connection.",
    bad_name: "Pick a name: 2-16 letters, numbers, spaces, _ - or @.",
    name_not_allowed: "That name isn't allowed. Pick another one.",
    slow_down: "Easy there! Give it a minute and try again.",
    session_expired: "That set took too long to submit.",
    session_already_used: "That set was already submitted.",
    bad_run: "The server couldn't verify that run.",
    http_404: "The game server isn't set up yet."
  };
  function explain(e) {
    if (e && e.code && MESSAGES[e.code]) return MESSAGES[e.code];
    return "Something went wrong (" + ((e && (e.code || e.message)) || "unknown") + ").";
  }
  return { get, post, explain, NetError };
})();

function wrapLines(text, maxW) {
  ctx.font = "800 12px Inter, sans-serif";
  const words = text.split(" "), lines = []; let cur = "";

}

  tapQ.length = 0; fx = { bursts: [], gloves: [], popups: [], parts: [], rings: [] }; resetShow(); shake = 0; flash = 0; lastCombo = 0; bubble = null; nextJoke = 420; laugh = 0;

}

/* ---------- leaderboard panel ---------- */
let lbPeriod = null;
function openLb(period) {
  const tabs = [["day", "24 HOURS"], ["week", "7 DAYS"], ["month", "30 DAYS"]];
  lbPeriod = period || lbPeriod || "day";
  if (!tabs.some(t => t[0] === lbPeriod)) lbPeriod = "day";
  const box = $("lbTabs"); box.innerHTML = "";
  tabs.forEach(([p, label]) => { const b = document.createElement("button"); b.className = "tab" + (p === lbPeriod ? " on" : ""); b.textContent = label; b.onclick = () => openLb(p); box.appendChild(b); });

  const li0 = document.createElement("li"); li0.className = "empty"; li0.textContent = "Loading…"; list.appendChild(li0);
  const want = lbPeriod;

    if (want !== lbPeriod) return; list.innerHTML = "";
    if (!r.entries.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nobody yet. Be the first on stage!"; list.appendChild(li); return; }
    const mine = (store.get("kb_punch_name", "") || "").toLowerCase();
    r.entries.forEach(e => {
      const li = document.createElement("li"); if (e.name.toLowerCase() === mine) li.className = "me";
      const a = document.createElement("b"); a.textContent = e.rank; const n = document.createElement("span"); n.textContent = e.name;
      const s = document.createElement("em"); s.textContent = fmt(e.score); li.append(a, n, s); list.appendChild(li);
    });

}

}

/* ---------- finishing a set ---------- */
function endRun() {
  const res = run.sim.result(); run.res = res; state = "over"; run.overT = 0;
  run.overDelay = 55;
  if (res.score > best) { best = res.score; run.newBest = true; store.set("kb_punch_best", best); }
  // mic drop, then the room decides: boos, polite claps, applause or a standing ovation
  const sc = res.score; let tier = sc < TIERS[0] ? 0 : sc < TIERS[1] ? 1 : sc < TIERS[2] ? 2 : 3;
  if (run.newBest && sc >= TIERS[1]) tier = 3;
  run.tier = tier; hs.hop = 0; hs.glow.a = 0;
  run.overDelay = [78, 88, 112, 150][tier];
  hs.micT = 0; cam.z = .06; cam.t = tier >= 1 ? .03 : .015; if (tier >= 1) hs.bowT = 70; if (tier === 3) confLeft = 200; else if (tier === 2) confLeft = 45;
  setTimeout(sfx.micdrop, 170);
  if (tier === 0) { hs.slump = 1.2; groan = 1; laugh = 0; setTimeout(sfx.boos, 0); say("TOUGH CROWD... I'LL BE HERE ALL WEEK.", 150); }
  else if (tier === 1) { sfx.applause(.4); say("THANK YOU, GOODNIGHT!", 130); }
  else if (tier === 2) { sfx.applause(1); hs.cheerT = 160; laugh = 1; say("THANK YOU! YOU'VE BEEN A BEAUTIFUL CROWD!", 150); pirouette(1); }
  else { sfx.applause(1.7); hs.cheerT = 260; laugh = 1; hostGlow("255,226,122", 1); pirouette(2); say("STANDING OVATION! I LOVE YOU ALL!", 170); }
  if (run.ranked) submitRun();
}
async function submitRun() {
  run.submit = "pending"; run.server = null;
  try { run.server = await Net.post("/api/score", { sessionId: run.sessionId, taps: run.taps }); run.submit = "done"; }
  catch (e) { run.submit = "error"; run.submitErr = Net.explain(e); run.submitCode = e.code; }
  if (run.shown) renderResult();
  if (run.submit === "done") { try { cfg = await Net.get("/api/config"); } catch (e) {} refreshMenu(); }
}
function countUp(el, to, ms) {      // the score ticks up like an arcade machine
  run.counting = true; const t0 = performance.now(), me = run; let lastTick = 0;
  (function tick(now) {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(to * e));
    if (now - lastTick > 70 && k < 1) { lastTick = now; sfx.count(k); }
    if (k < 1 && run === me) requestAnimationFrame(tick); else { if (run === me) run.counting = false; el.textContent = fmt(to); }
  })(t0);
}
function renderResult() {

  const TT = ["TOUGH CROWD!", "SET OVER!", "NICE SET!", "STANDING OVATION!"], tier = run.tier == null ? 1 : run.tier;
  $("resTitle").textContent = TT[tier]; $("resTitle").className = tier === 0 ? "bad" : "";
  const shownScore = s && typeof s.score === "number" ? s.score : r.score;
  if (!run.counted) { run.counted = true; countUp($("resScore"), shownScore, 1100); } else if (!run.counting) $("resScore").textContent = fmt(shownScore);
  $("resBest").textContent = run.newBest ? "NEW PERSONAL BEST!" : (best ? "YOUR BEST: " + fmt(best) : "");
  const acc = r.punches ? Math.round(r.hits / r.punches * 100) : 0;
  const grid = $("resGrid"); if (!run.gridDone) { run.gridDone = true; grid.innerHTML = "";
  [["HECKLERS PUNCHED", r.hits, "#ffc83d"], ["BEST COMBO", r.maxCombo + "×", "#7bff9e"], ["ACCURACY", acc + "%", "#fff"], ["COMMUNITY HITS", r.holders || 0, r.holders ? "#ff6a74" : "#7bff9e"], ["BONUSES", r.drinks + " 🍹  " + r.pimps + " 🎩", "#fff"], ["EXTRA TIME", "+" + (r.drinks * 4 + r.pimps * 5) + "s", "#fff"]].forEach(([k, v, c]) => {
    const d = document.createElement("div"); const a = document.createElement("small"); a.textContent = k; const b = document.createElement("b"); b.textContent = v; b.style.color = c; d.append(a, b); grid.appendChild(d);
  }); }
  const rk = $("resRanks"); rk.innerHTML = ""; $("btnRetry").hidden = true; $("btnAgain").disabled = false;
  if (!run.ranked) setMsg("resMsg", "Practice set. Not on the leaderboard." + (cfg ? " Play ranked to get on it!" : ""));
  else if (run.submit === "pending" || run.submit === "none") setMsg("resMsg", "Verifying your set with the server…");
  else if (run.submit === "error") { setMsg("resMsg", run.submitErr, "err"); if (run.submitCode !== "session_already_used" && run.submitCode !== "bad_run" && run.submitCode !== "session_expired") $("btnRetry").hidden = false; }
  else if (s.status === "review") setMsg("resMsg", "Nice set! The crew is double-checking it before it lands on the board.", "warn");
  else {
    setMsg("resMsg", "");

      const v = s.ranks && s.ranks[k]; if (!v) return; const d = document.createElement("div"); const a = document.createElement("small"); a.textContent = label; const b = document.createElement("b"); b.textContent = v.plus ? "100+" : "#" + v.rank; d.append(a, b); rk.appendChild(d);
    });

/* ---------- main loop ---------- */
const JOKE_EVERY = 560;
function stepFx() {
  frame++;
  for (const p of fx.parts) { p.x += p.vx; p.y += p.vy; p.vy += .25; p.life--; p.rot += .15; }
  fx.parts = fx.parts.filter(p => p.life > 0);
  fx.bursts = fx.bursts.filter(b => frame - b.t0 <= b.life); fx.gloves = fx.gloves.filter(g => frame - g.t0 <= 12); fx.popups = fx.popups.filter(p => frame - p.t0 <= p.life); fx.rings = fx.rings.filter(r => frame - r.t0 <= r.life);
  shake *= .84; flash *= .9; jab *= .82; lean *= .93; laugh *= .985; groan *= .975;
  hs.hop *= .86; hs.slump *= .965; hs.shake = hs.slump > .05 ? Math.sin(frame * 1.4) * 3 * hs.slump : 0; hs.glow.a *= .93;
  if (hs.turnT > 0) { hs.turnT--; hs.turn = (1 - hs.turnT / hs.turnDur) * Math.PI * 2 * hs.turns; if (!hs.turnT) hs.turn = 0; }
  hs.flap = hs.flapT > 0 ? Math.min(1, hs.flapT-- / 25) : 0;
  hs.glass = hs.glassT > 0 ? Math.min(1, hs.glassT-- / 25) : 0;
  hs.cheer = hs.cheerT > 0 ? Math.min(1, hs.cheerT-- / 40) : 0;
  if (bubble && --bubble.life <= 0) bubble = null;
  // the beat: faster and faster as the set heats up
  beatPh += .11 + .075 * heat; beat = Math.pow(.5 + .5 * Math.sin(beatPh), 3);
  cam.z += (cam.t - cam.z) * .12;
  if (hs.bowT > 0) { hs.bowT--; hs.bow = Math.sin(Math.min(1, 1 - hs.bowT / 70) * Math.PI); } else hs.bow = 0;
  if (hs.micT >= 0) { hs.micT++; const u = Math.min(1, hs.micT / 14); hs.micA = 1.5 * u * u - (u >= 1 ? .13 * Math.exp(-(hs.micT - 14) * .22) * Math.abs(Math.cos((hs.micT - 14) * .5)) : 0); }
  const ov = state === "over" && run ? (run.tier === 3 ? 1 : run.tier === 2 ? .35 : 0) : 0; showK += (ov - showK) * .04;
  if (confLeft > 0) { for (let i = 0; i < (lowFx ? 1 : 3); i++) confetti.push({ x: Math.random() * W, y: -10 - Math.random() * 30, vx: (Math.random() - .5) * 1.2, vy: 1.4 + Math.random() * 2.2, a: Math.random() * 6, va: (Math.random() - .5) * .3, w: 5 + Math.random() * 4, h: 8 + Math.random() * 5, c: pick(CONF), ph: Math.random() * 6 }); confLeft -= lowFx ? 6 : 3; }
  for (const p of confetti) { p.y += p.vy; p.x += p.vx + Math.sin(frame * .05 + p.ph) * .8; p.a += p.va; }
  if (confetti.length) confetti = confetti.filter(p => p.y < H + 20);
}
function update() {
  stepFx();
  { const tgt = state === "play" ? Math.min(1, run.sim.s.frame / 3600) : state === "menu" ? .3 : state === "over" ? heat : 0; heat += (tgt - heat) * .05; }
  if (state === "menu") { attract.step(-1, -1); if (attract.s.over) attract = KB.createSim(rndSeed()); }
  else if (state === "brief") {
    run.briefT++;
    for (const e of run.briefEnts) if (e.slot < 0) e.x = e.x0 + e.vx * Math.max(0, run.briefT - e.born);
    if (run.briefT >= run.briefLen) endBrief();
  }
  else if (state === "ready") { run.readyT--; const n = Math.ceil((run.readyT - 30) / 40); if (run.readyT > 30 && (run.readyT - 30) % 40 === 0 && n > 0) sfx.tick(); if (run.readyT === 119 || run.readyT === 36) noise(.45, .05); if (run.readyT <= 0) { state = "play"; sfx.go(); say("GOOD EVENING, FOLKS! TAP THE HECKLERS!", 150); } }
  else if (state === "play") {
    const sim = run.sim, s = sim.s; let t = null;
    if (tapQ.length) {              // taps are never lost: one that lands in the punch cooldown, or on someone still popping up, waits a few frames
      const q = tapQ[0];
      if (frame - q[2] > 9) tapQ.shift();
      else if (s.cooldown === 0 && !risingAt(s, q[0], q[1])) t = tapQ.shift();
    }
    lastCombo = s.combo;
    if (t) { run.taps.push([s.frame, t[0], t[1]]); sim.step(t[0], t[1]); } else sim.step(-1, -1);
    handleEvents(s.events);
    if (s.timeLeft > 0 && s.timeLeft <= 600 && s.timeLeft % 60 === 0) sfx.tick();
    if (--nextJoke <= 0 && !bubble) { say(pick(JOKES), 200); nextJoke = JOKE_EVERY + Math.floor(Math.random() * 200); }
    if (s.over) endRun();
  } else if (state === "over") {
    run.overT++;
    if (!run.shown && run.overT >= run.overDelay) { run.shown = true; renderResult(); show("result"); }
  }
}

function risingAt(s, x, y) {        // is the tap on someone who is visible but not punchable yet (still popping up)?
  const f = s.frame; let rising = false;
  for (const e of s.ents) {
    if (e.hit || f >= e.hitEnd) continue; const r = KB.entRect(e);
    if (x < r.x1 - KB.TAP_SLOP_X || x > r.x2 + KB.TAP_SLOP_X || y < r.y1 - KB.TAP_SLOP_Y || y > r.y2 + KB.TAP_SLOP_Y) continue;
    if (f >= e.hitStart) return false; rising = true;
  }
  return rising;
}
function activeSim() { return (state === "menu" || !run) ? attract.s : run.sim.s; }
function drawBrief(ents, f) {
  // title plate along the bottom (the stage and the first row stay clear for the labels)
  const k = Math.min(1, f / 14), blink = 0.55 + 0.45 * Math.sin(f * 0.15);
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = "rgba(7,5,26,.92)"; ctx.strokeStyle = "#6a4bd0"; ctx.lineWidth = 2; Art.RR(46, 656, W - 92, 58, 12); ctx.fill(); ctx.stroke();
  Art.text("MEET THE CROWD", W / 2, 671, 15, "#ffc83d");
  Art.text("PUNCH THE GREEN · LEAVE THE RED ALONE", W / 2, 688, 9.5, "#e2e6f7", "center", "Inter", 0);
  ctx.globalAlpha = k * blink; Art.text("TAP TO START", W / 2, 703, 9, "#ffffff", "center", "Inter", 0);
  ctx.restore();
  for (const e of ents) {
    const age = f - e.born - 8; if (age < 0) continue;
    const a = Math.min(1, age / 8), t = e.tag;
    if (e.slot >= 0) { const sl = KB.SLOTS[e.slot]; Art.drawTag(sl.x, sl.y - 84 * sl.s - 29, t[2], t[3], t[4], a); }
    else Art.drawTag(e.x, e.y + 8, t[2], t[3], t[4], a);
  }
}
function render() {
  ctx.save();
  if (shake > .5) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  if (cam.z > .002) { ctx.translate(W / 2, 250); ctx.scale(1 + cam.z, 1 + cam.z); ctx.translate(-W / 2, -250); }
  const s = activeSim(), inBrief = state === "brief", f = inBrief ? run.briefT : s.frame, ents = inBrief ? run.briefEnts : s.ents;
  Art.drawBackground(); Art.drawSpot(frame, { heat, beat, show: showK }); hs.lean = lean; hs.jab = jab; hs.mult = (state === "play" || state === "over") && run ? 1 + Math.min(4, Math.floor(run.sim.s.combo / 5)) : 1;
  Art.setCrowd({ laugh, groan }); Art.drawHost(frame, hs);
  Art.drawCurtains(curtainK());
  Art.drawAudience(ents, f);
  Art.drawForeground(frame, laugh, { mult: hs.mult, cheer: hs.cheer > .05 ? 1 : 0 }); Art.drawVignette(); Art.drawEdgeGlow(hs.mult, beat);
  if (inBrief) drawBrief(ents, f);
  if (bubble) Art.drawBubble(bubble.lines, Math.min(1, bubble.life / 12, (bubble.max - bubble.life + 1) / 6), bubble.side);
  for (const r of fx.rings) Art.drawRing(r, frame);
  for (const b of fx.bursts) Art.drawBurst(b, frame);
  for (const g of fx.gloves) Art.drawGlove(g, frame);
  for (const p of fx.popups) Art.drawPopup(p, frame);
  for (const p of fx.parts) Art.drawParticle(p);
  if (confetti.length) Art.drawConfetti(confetti, frame);
  if (state === "brief" || state === "ready" || state === "play" || (state === "over" && !(run && run.shown))) Art.drawHUD(s, { warn: state === "play" && frame < warnUntil, beat });
  if (state === "ready") {
    const left = run.readyT - 30, a = Math.min(1, run.readyT / 20);
    ctx.save(); ctx.globalAlpha = a;
    if (left > 0) { const n = Math.ceil(left / 40), k = 1 - ((left - 1) % 40) / 40; ctx.translate(W / 2, 330); ctx.scale(1 + (1 - k) * .5, 1 + (1 - k) * .5); Art.text(String(n), 0, 0, 90, "#ffc83d"); }
    else { ctx.translate(W / 2, 330); Art.text("PUNCH!", 0, 0, 56, "#fff"); }
    ctx.restore();
    Art.text("LIGHTS UP. HERE THEY COME…", W / 2, 420, 14, "#e2e6f7", "center", "Inter");
  }
  if (flash > .02) { ctx.fillStyle = "rgba(" + flashColor + "," + flash * .5 + ")"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
let last = performance.now(), acc = 0, slowFrames = 0, lowFx = false;
function loop(now) {
  if (!lowFx && document.visibilityState === "visible") {      // a slow phone? quietly drop the decorations, never the gameplay
    const dt = now - last; if (dt > 26 && dt < 250) slowFrames++; else if (dt < 20) slowFrames = Math.max(0, slowFrames - 2);
    if (slowFrames > 90) { lowFx = true; Art.setLow(true); }
  }
  if (!window.__kbManual) {
    acc += Math.min(100, now - last);
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  }
  last = now; render(); requestAnimationFrame(loop);
}

/* ---------- input ---------- */
cv.addEventListener("pointerdown", e => {
  if (state === "brief") { e.preventDefault(); if (run.briefT > 20) endBrief(); return; }
  if (state === "over" && run && !run.shown && run.overT > 40) { e.preventDefault(); run.overDelay = run.overT; return; }
  if (state !== "play") return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = Math.max(0, Math.min(W, Math.round((e.clientX - r.left) / scale))), y = Math.max(0, Math.min(H, Math.round((e.clientY - r.top) / scale)));
  if (tapQ.length < 4) tapQ.push([x, y, frame]);
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (er) {}
});
window.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (state === "menu" && !$("menu").classList.contains("show")) { show("menu"); return; } if ($("lb").classList.contains("show")) { show(state === "over" && run && run.shown ? "result" : "menu"); return; } location.href = "/"; }
});
$("btnRanked").onclick = () => { if ($("btnRanked").dataset.mode === "practice") startPractice(); else startRanked(); };
$("btnPractice").onclick = () => startPractice();
$("btnLb").onclick = () => openLb();
$("lbClose").onclick = () => show(state === "over" && run && run.shown ? "result" : "menu");
$("btnAgain").onclick = () => {
  if (!run) return startPractice();
  if (run.ranked && cfg) { show("menu"); startRanked(); } else startPractice();
};
$("btnRetry").onclick = () => { $("btnRetry").hidden = true; setMsg("resMsg", "Verifying your set with the server…"); submitRun(); };
$("btnResLb").onclick = () => openLb();
$("btnResMenu").onclick = () => { state = "menu"; resetShow(); show("menu"); refreshMenu(); };
function shareUrl() {            // the address X turns into a card: set SHARE_URL in the page settings, otherwise this page without any ?query
  if (CFG.SHARE_URL) return CFG.SHARE_URL;
  try { const u = new URL(location.href); u.search = ""; u.hash = ""; return u.href; } catch (e) { return location.href; }
}
$("btnShare").onclick = () => {
  const r = run && run.res; if (!r) return;
  const sv = run.server, rk = sv && sv.ranks && sv.ranks.day ? sv.ranks.day.rank : 0;
  const t = "I scored " + fmt(sv && typeof sv.score === "number" ? sv.score : r.score) + " in Punch Line 🥊🦇" + (rk && rk <= 10 ? " (#" + rk + " in the last 24h!)" : "") + " " + r.hits + " hecklers punched, " + r.maxCombo + "× combo. Can you beat it? $KATTBATT";
  window.open("https://x.com/intent/post?text=" + encodeURIComponent(t) + "&url=" + encodeURIComponent(shareUrl()), "_blank", "noopener");
};
$("nameIn").value = store.get("kb_punch_name", "");
$("nameIn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("btnRanked").click(); } e.stopPropagation(); });

/* ---------- boot ---------- */
async function boot() {
  show("menu"); refreshMenu();
  loadArt();
  try { cfg = await Net.get("/api/config"); } catch (e) { cfg = null; }
  refreshMenu();
  setInterval(() => { if (state === "menu" && $("menu").classList.contains("show")) refreshMenu(); }, 30000);
}
window.__kb = {
  get state() { return state; }, get run() { return run; }, get fx() { return fx; }, get cfg() { return cfg; },
  update, render, startPractice, begin, tap(x, y) { tapQ.push([x, y, frame]); }, setState(s) { state = s; },
  advance(n) { for (let i = 0; i < n; i++) update(); render(); }, say, handleEvents, show,
  manual(on) { window.__kbManual = !!on; }, sfx
};
boot();
requestAnimationFrame(loop);

/* Home button: go to the main page no matter how it's tapped (same as the other games) */
const home = $("homeBtn");
const go = e => { e.preventDefault(); e.stopPropagation(); location.href = "/"; };
home.addEventListener("pointerup", go); home.addEventListener("touchend", go, { passive: false }); home.addEventListener("click", go);
})();

</script>
